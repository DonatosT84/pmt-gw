doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        profiling_collect_backtrace: '%kernel.debug%'
        use_savepoints: true
        types:
            payment_id: App\Payment\Infrastructure\Persistence\Doctrine\Type\PaymentIdType
            payer_email: App\Payment\Infrastructure\Persistence\Doctrine\Type\PayerEmailType
    orm:
        auto_generate_proxy_classes: true
        enable_lazy_ghost_objects: true
        report_fields_where_declared: true
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: false
        mappings:
            PaymentDomain:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/config/doctrine/domain'
                prefix: 'App\Payment\Domain'
                alias: Payment
            PaymentInfrastructure:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/config/doctrine/infrastructure'
                prefix: 'App\Payment\Infrastructure\Persistence\Doctrine'
                alias: PaymentInfrastructure
        controller_resolver:
            auto_mapping: false

when@test:
    doctrine:
        dbal:
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            auto_generate_proxy_classes: false
            proxy_dir: '%kernel.build_dir%/doctrine/orm/Proxies'
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
